name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Swift and TypeScript tests
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core tests
        run: pnpm --filter @whatthetoken/core test

      - name: Run Mac tests
        working-directory: apps/mac
        run: swift test

      - name: Build Mac Xcode app target
        run: xcodebuild -project apps/mac/WhatTheToken.xcodeproj -scheme WhatTheToken -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

      - name: Verify resolved Release hardened runtime setting
        run: |
          xcodebuild -project apps/mac/WhatTheToken.xcodeproj -scheme WhatTheToken -configuration Release -showBuildSettings CODE_SIGNING_ALLOWED=NO > /tmp/whatthetoken-release-build-settings.txt
          grep -F "ENABLE_HARDENED_RUNTIME = YES" /tmp/whatthetoken-release-build-settings.txt

      - name: Verify Mac release metadata
        run: |
          plutil -lint apps/mac/Packaging/Info.plist
          plutil -lint apps/mac/Packaging/ExportOptions.DeveloperID.plist
          plutil -lint apps/mac/Packaging/PrivacyInfo.xcprivacy
          plutil -lint apps/mac/Packaging/WhatTheToken.entitlements
          plutil -lint apps/mac/WhatTheToken.xcodeproj/project.pbxproj
          xmllint --noout apps/mac/WhatTheToken.xcodeproj/xcshareddata/xcschemes/WhatTheToken.xcscheme
          ruby -rjson -e 'JSON.parse(File.read(ARGV.fetch(0)))' apps/mac/WhatTheToken.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          test -f apps/mac/Sources/WhatTheTokenMac/Assets.xcassets/AppIcon.appiconset/Contents.json
          apps/mac/Scripts/rehearse-release.sh --version 0.1.0 --build 1 --mode dry-run
